[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctxf"
version = "0.1.0"
description = "Self-hostable Agentic Context Engineering — evolve your AI playbook automatically"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Samir George", email = "samir@sabbk.com" },
]
keywords = ["context-engineering", "ai", "agents", "playbook", "ace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
]

[project.scripts]
ctxf = "ctxf.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["ctxf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
